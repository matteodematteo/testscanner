<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Barcode Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #111;
    color: #fff;
  }
  body {
    display: flex;
    flex-direction: column;
  }

  /* --- Camera preview: fixed to 1/4 of viewport height, always visible --- */
  #reader-wrap {
    width: 100%;
    height: 25vh;
    min-height: 140px;
    background: #000;
    overflow: hidden;
    flex-shrink: 0;
    position: relative;
    border-bottom: 2px solid #333;
  }
  #reader { width: 100%; height: 100%; }
  #reader video {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover;
  }
  /* Hide standard library overlay buttons and headers */
  #reader__dashboard_section_csr button,
  #reader__dashboard_section_csr select {
    display: none !important;
  }
  #reader__header_message { display: none !important; }

  /* --- Main container below the preview --- */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* --- Live status strip --- */
  #status-bar {
    background: #222;
    border-bottom: 1px solid #333;
    padding: 10px 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    font-weight: 500;
    flex-shrink: 0;
  }
  #status {
    color: #4caf50;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-right: 10px;
  }
  #toggleScanBtn {
    background: #4caf50;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s ease;
  }
  #toggleScanBtn:disabled {
    background: #444;
    color: #888;
    cursor: not-allowed;
  }

  /* --- Navigation Tabs --- */
  #tabs {
    display: flex;
    background: #1a1a1a;
    border-bottom: 1px solid #333;
    flex-shrink: 0;
  }
  .tab-btn {
    flex: 1;
    background: none;
    border: none;
    color: #aaa;
    padding: 12px 0;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    border-bottom: 2px solid transparent;
    transition: all 0.2s ease;
  }
  .tab-btn.active {
    color: #4caf50;
    border-bottom-color: #4caf50;
    background: rgba(76, 175, 80, 0.05);
  }

  /* --- Tab Content Areas --- */
  .tab-content {
    flex: 1;
    display: none;
    flex-direction: column;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 15px;
  }
  .tab-content.active {
    display: flex;
  }

  /* --- Log Tab --- */
  #log {
    flex: 1;
    font-family: monospace;
    font-size: 12px;
    background: #050505;
    border: 1px solid #222;
    border-radius: 4px;
    padding: 10px;
    margin-bottom: 15px;
    overflow-y: auto;
    color: #0f0;
    white-space: pre-wrap;
    word-break: break-all;
    min-height: 120px;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 15px;
    flex-shrink: 0;
  }
  .stat-card {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 10px;
    text-align: center;
  }
  .stat-card div:first-child {
    font-size: 11px;
    color: #888;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .stat-card div:last-child {
    font-size: 16px;
    font-weight: bold;
    color: #4caf50;
  }

  /* --- Capture List Tab --- */
  #captured-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    flex-shrink: 0;
  }
  #captured-header h3 {
    margin: 0;
    font-size: 16px;
    color: #fff;
  }
  #clearListBtn {
    background: transparent;
    border: 1px solid #ff4d4d;
    color: #ff4d4d;
    padding: 4px 8px;
    font-size: 12px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  #clearListBtn:hover {
    background: rgba(255, 77, 77, 0.1);
  }
  #captured-list {
    flex: 1;
    list-style: none;
    padding: 0;
    margin: 0;
    overflow-y: auto;
  }
  .captured-item {
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .captured-info {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }
  .captured-code {
    font-family: monospace;
    font-size: 14px;
    font-weight: bold;
    color: #fff;
    word-break: break-all;
  }
  .captured-meta {
    font-size: 11px;
    color: #888;
  }
  .captured-delete {
    background: none;
    border: none;
    color: #ff4d4d;
    font-size: 18px;
    cursor: pointer;
    padding: 0 4px;
  }

  /* --- Settings Tab Form UI --- */
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    gap: 10px;
  }
  label {
    font-size: 14px;
    color: #ccc;
    font-weight: 500;
  }
  input[type="range"] {
    flex: 1;
    accent-color: #4caf50;
  }
  select, input[type="text"] {
    background: #222;
    border: 1px solid #444;
    color: #fff;
    padding: 8px 10px;
    border-radius: 4px;
    font-size: 13px;
  }
  select {
    flex: 1;
    max-width: 60%;
  }
  .chips-container {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 15px;
  }
  .chip {
    background: #222;
    border: 1px solid #444;
    color: #aaa;
    padding: 6px 12px;
    border-radius: 16px;
    font-size: 12px;
    cursor: pointer;
    user-select: none;
    font-weight: 500;
    transition: all 0.2s ease;
  }
  .chip.active {
    background: #4caf50;
    color: #fff;
    border-color: #4caf50;
  }
  #applyBtn {
    background: #4caf50;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 12px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
    margin-top: 15px;
    transition: background 0.2s ease;
  }
  #applyBtn:hover {
    background: #45a049;
  }
</style>
</head>
<body>

  <div id="reader-wrap">
    <div id="reader"></div>
  </div>

  <div id="main">
    <div id="status-bar">
      <div id="status">Ready</div>
      <button id="toggleScanBtn">Start Scan</button>
    </div>

    <div id="tabs">
      <button class="tab-btn active" data-tab="tab-log">Terminal Log</button>
      <button class="tab-btn" data-tab="tab-list">Captured</button>
      <button class="tab-btn" data-tab="tab-settings">Settings</button>
    </div>

    <div id="tab-log" class="tab-content active">
      <div class="stats-grid">
        <div class="stat-card">
          <div>Avg Latency</div>
          <div id="statLatency">0 ms</div>
        </div>
        <div class="stat-card">
          <div>Total Scanned</div>
          <div id="statCount">0</div>
        </div>
        <div class="stat-card">
          <div>Scans/Sec</div>
          <div id="statRate">0.00</div>
        </div>
      </div>
      <div id="log">=== Debug Terminal Initialized ===&#10;</div>
    </div>

    <div id="tab-list" class="tab-content">
      <div id="captured-header">
        <h3>Captured Codes</h3>
        <button id="clearListBtn">Clear All</button>
      </div>
      <ul id="captured-list">
        </ul>
    </div>

    <div id="tab-settings" class="tab-content">
      <h3 style="margin-top:0;font-size:16px;">Active Formats</h3>
      <div class="chips-container" id="formatChips">
